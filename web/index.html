function asState(s){return {stage:s.phase,first:s.first,second:s.second,originalFirst:s.original_first,originalSecond:s.original_second,originalAnnotations:s.original_annotations||[],annotations:s.annotations||[],initialCards:s.initial_cards,cards:s.cards,excluded:s.excluded,submittedAt:s.submitted_at,completedAt:s.stage1_at,revision:s.revision}}
async function api(path,data,auth=token){let res=await fetch(path,{method:data===undefined?'GET':'POST',headers:{...(data!==undefined?{'Content-Type':'application/json'}:{}),...(auth?{'Authorization':'Bearer '+auth}:{})},...(data===undefined?{}:{body:JSON.stringify(data)}),cache:'no-store'});let obj=await res.json().catch(()=>({}));if(!res.ok)throw Error(obj.error||'서버에 연결하지 못했어요.');return obj}
function markStatus(message,error=false){let el=$('#saveStatus')||$('#networkStatus');if(el){el.textContent=message;el.classList.toggle('error',error)}}
function backupKey(){return 'rf-pending-'+student}
function restorePending(server){try{let b=JSON.parse(localStorage.getItem(backupKey())||'null');if(b&&b.version===server.revision&&b.stage===server.phase&&b.stage!==3){if(b.stage===1){state.first=b.first;state.second=b.second;if(Array.isArray(b.annotations))state.annotations=b.annotations}else if(b.stage===2){state.cards=b.cards}dirty=true;setTimeout(()=>flushSave().catch(()=>{}),400)}}catch(e){}}
function save(){if(!state||state.stage===3)return;dirty=true;try{localStorage.setItem(backupKey(),JSON.stringify({version:state.revision,stage:state.stage,first:state.first,second:state.second,annotations:state.annotations,cards:state.cards}))}catch(e){}
  markStatus('자동 저장 중…');clearTimeout(saveTimer);saveTimer=setTimeout(()=>flushSave().catch(()=>{}),500)}
async function flushSave(){clearTimeout(saveTimer);if(savingPromise){try{await savingPromise}catch(e){};}
 if(!dirty||!state||state.stage===3)return;
 dirty=false;let sentStage=state.stage;
 const payload=sentStage===1?{revision:state.revision,first:[...state.first],second:[...state.second],annotations:JSON.parse(JSON.stringify(state.annotations))}:{revision:state.revision,cards:JSON.parse(JSON.stringify(state.cards))};
 savingPromise=api(sentStage===1?'/api/student/save-records':'/api/student/save-cards',payload);
 try{const r=await savingPromise;state.revision=r.student.revision;if(!dirty){try{localStorage.removeItem(backupKey())}catch(e){}}markStatus('자동 저장 완료 ✓')}
 catch(e){dirty=true;markStatus('저장 실패: '+e.message,true);throw e}
 finally{savingPromise=null}
 if(dirty)return flushSave();
}
function busy(msg){let div=document.createElement('div');div.className='busy-overlay';div.id='busy';div.innerHTML='<div class="busy-box"><div class="small-loader"></div><div>'+escapeHtml(msg)+'</div><small>화면을 닫지 말아 주세요.</small></div>';document.body.appendChild(div)}

function renderLogin(){app.className='ocean';app.innerHTML=`<div class="shell"><div class="topbar"><div class="brand"><span class="brand-mark">${brandSvg()}</span>작은 질문, 깊은 생각</div><div class="right-tools"><span class="prototype-pill">학생용</span></div></div><section class="login-wrap"><div class="login-top">${fishSvg()}<div><h1>무지개 물고기 질문 여행</h1><p>자신의 번호를 선택하고 시작해 주세요.</p></div></div><div class="student-grid">${numbers.map(n=>`<button class="student-select ${chosen===n?'active':''}" data-n="${n}" aria-label="${n}번">${n}</button>`).join('')}</div><div class="login-foot"><div>${config.requiresPin?'<label>접속 코드 <input class="pin-input" id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="6자리"/></label>':'<span class="login-disclaimer">번호를 확인하고 입장하세요.</span>'}</div><button class="primary" id="enterBtn" ${chosen?'':'disabled'}>${chosen?chosen+'번으로 시작하기':'번호를 선택해 주세요'} →</button></div><div id="networkStatus" class="status-message"></div></section></div>`;
 app.querySelectorAll('[data-n]').forEach(el=>el.onclick=()=>{chosen=Number(el.dataset.n);renderLogin()});$('#enterBtn').onclick=async()=>{if(!chosen)return;try{markStatus('입장 중…');let info=await api('/api/student/login',{number:chosen,pin:$('#pinInput')?.value||''},'');token=info.token;sessionStorage.setItem('rf-student-token',token);student=chosen;await loadStudent()}catch(e){markStatus(e.message,true)}}}
async function loadStudent(){let x=await api('/api/student/me');student=x.student.number;state=asState(x.student);restorePending(x.student);render()}
function bindTop(){$('#exitBtn').onclick=async()=>{try{await flushSave()}catch(e){alert('자동 저장에 실패했어요. 인터넷을 확인하고 다시 시도해 주세요.');return}token='';sessionStorage.removeItem('rf-student-token');student=null;state=null;chosen=null;renderLogin()}}
function render(){if(!state)return renderLogin();app.className=state.stage===1?'ocean':'paper';app.innerHTML=`<div class="shell">${top()}${state.stage===3?completeView():heading(state.stage)}${state.stage===1?recordView():state.stage===2?sortView():''}<div class="demo-warning">${config.demo?'현재 AI 질문 분류는 시험용 규칙으로 실행됩니다. 실제 수업에는 API 연결이 필요해요.':'내 기록은 자동 저장됩니다. 제출하면 결과만 확인할 수 있어요.'}</div></div>`;bindTop();if(state.stage===1)bindRecord();if(state.stage===2)bindSort();if(state.stage===3)bindComplete()}

function markedPassage(text,row){
 const marks=(state.annotations||[]).filter(m=>m.row===row&&m.start>=0&&m.end<=text.length);
 const cuts=new Set([0,text.length]);for(const m of marks){cuts.add(m.start);cuts.add(m.end)}
 const points=[...cuts].sort((a,b)=>a-b);let out='';
 for(let i=0;i<points.length-1;i++){
  let start=points[i],end=points[i+1];if(end<=start)continue;
  const overlapping=marks.filter(m=>m.start<=start&&m.end>=end);
  const hi=overlapping.filter(m=>m.type==='highlight').at(-1),under=overlapping.some(m=>m.type==='underline');
  const classes=['passage-segment'];if(hi)classes.push('mark-highlight','mark-'+hi.color);if(under)classes.push('mark-underline');
  out+=`<span class="${classes.join(' ')}">${escapeHtml(text.slice(start,end))}</span>`;
 }
 return out;
}
function capturePassageRange(){
 const selection=window.getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount)return null;
 const r=selection.getRangeAt(0);
 const anchor=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;
 const focus=r.endContainer.nodeType===1?r.endContainer:r.endContainer.parentElement;
 const el=anchor?.closest('.passage-content');if(!el||el!==focus?.closest('.passage-content'))return null;
 const startRange=document.createRange();startRange.selectNodeContents(el);startRange.setEnd(r.startContainer,r.startOffset);
 const endRange=document.createRange();endRange.selectNodeContents(el);endRange.setEnd(r.endContainer,r.endOffset);
 const start=startRange.toString().length,end=endRange.toString().length;
 if(end<=start)return null;
 return {row:Number(el.dataset.row),start,end};
}
function applyPassageMark(kind){
 const selection=chosenPassageRange||capturePassageRange();
 if(!selection){$('#selectionHelp').textContent='먼저 본문에서 글자를 선택해 주세요.';return}
 const {row,start,end}=selection;
 const result=[];
 for(const m of (state.annotations||[])){
  if(m.row!==row||m.end<=start||m.start>=end||(kind!=='clear'&&m.type!==kind)){
   result.push(m);continue;
  }
  if(m.start<start)result.push({...m,end:start});
  if(m.end>end)result.push({...m,start:end});
 }
 if(kind!=='clear')result.push({row,start,end,type:kind,color:kind==='highlight'?'yellow':'dark',source:'student'});
 state.annotations=result;
 const passage=document.querySelector(`.passage-content[data-row="${row}"]`);
 if(passage)passage.innerHTML=markedPassage(rows[row],row);
 window.getSelection()?.removeAllRanges();chosenPassageRange=null;
 $('#selectionHelp').textContent=kind==='clear'?'표시를 지웠어요.':'표시를 추가했어요.';
 save();
}

function recordView(){return `<section class="panel" aria-label="자세히 읽기 기록 수정"><div class="panel-head"><strong>나의 자세히 읽기 기록</strong><div class="mini-info">✎ &nbsp; 1차·2차 기록과 본문 표시를 수정할 수 있어요</div></div><div class="marker-toolbar" role="toolbar" aria-label="본문 표시 도구"><span class="marker-help">글에서 표시할 부분을 선택하세요. 태블릿에서는 길게 눌러 선택해요. 종이에서 옮긴 표시도 확인하고 고칠 수 있어요.</span><button class="highlighter" type="button" data-ink="highlight">형광펜</button><button class="underline-tool" type="button" data-ink="underline">밑줄</button><button class="marker-clear" type="button" data-ink="clear">표시 지우기</button><span id="selectionHelp" aria-live="polite"></span></div><div class="table-viewport"><table class="record-table"><colgroup><col/><col/><col/></colgroup><thead><tr><th scope="col">글</th><th scope="col">1차 기록</th><th scope="col">2차 기록</th></tr></thead><tbody>${rows.map((t,i)=>`<tr><td class="passage"><span class="rowno">장면 ${String(i+1).padStart(2,'0')}</span>${`<div class="passage-content" data-row="${i}">${markedPassage(t,i)}</div>`}</td><td><textarea aria-label="${i+1}행 1차 기록" data-row="${i}" data-col="first" placeholder="기록이 없으면 비워두세요">${escapeHtml(state.first[i])}</textarea></td><td><textarea aria-label="${i+1}행 2차 기록" data-row="${i}" data-col="second" placeholder="기록이 없으면 비워두세요">${escapeHtml(state.second[i])}</textarea></td></tr>`).join('')}</tbody></table></div><div class="panel-foot"><span class="foot-caption" id="saveStatus">학생이 쓴 글을 확인하고 필요한 곳만 수정하세요. 자동 저장됩니다.</span><button class="primary" id="nextBtn">수정 완료하고 다음으로 &nbsp; →</button></div></section>`}

function bindRecord(){chosenPassageRange=null;document.querySelectorAll('.passage-content').forEach(el=>{el.addEventListener('pointerup',()=>setTimeout(()=>{const r=capturePassageRange();if(r){chosenPassageRange=r;$('#selectionHelp').textContent='선택됨: '+rows[r.row].slice(r.start,r.end).slice(0,16)}},0));el.addEventListener('keyup',()=>{const r=capturePassageRange();if(r)chosenPassageRange=r})});document.querySelectorAll('[data-ink]').forEach(b=>{b.addEventListener('pointerdown',e=>{const r=capturePassageRange();if(r)chosenPassageRange=r;/* preserve selection captured on pointerdown */});b.addEventListener('click',()=>applyPassageMark(b.dataset.ink))});document.querySelectorAll('textarea[data-row]').forEach(el=>el.addEventListener('input',()=>{state[el.dataset.col][Number(el.dataset.row)]=el.value;save()}));$('#nextBtn').onclick=()=>{showModal(`<h2>정말 모두 확인했나요?</h2><p>AI가 읽은 내용과 실제로 쓴 활동지를 빠짐없이 비교했는지 다시 확인해 주세요.</p><div class="warning">다음 단계로 넘어가면 기록을 다시 수정하거나 1단계로 돌아올 수 없어요.</div><div class="modal-actions"><button class="secondary" data-close>다시 확인하기</button><button class="primary" id="confirmNext">네, 다음 단계로</button></div>`,()=>{$('#confirmNext').onclick=async()=>{let b=$('#confirmNext');b.disabled=true;closeModal();busy('질문을 추출하고 분류하고 있어요.');try{await flushSave();let result=await api('/api/student/advance',{});state=asState(result.student);unbusy();render()}catch(e){unbusy();alert(e.message);render()}}})}}

function renderCards(){CATS.forEach(c=>{let list=document.querySelector(`[data-list="${c.key}"]`);if(!list)return;const items=state.cards.filter(x=>x.category===c.key);list.innerHTML=items.length?items.map((q,i)=>`<div class="note ${q.added?'added':''}" role="button" tabindex="0" data-id="${escapeHtml(q.id)}" style="--rotate:${(i%4-1.5)*.36}deg" aria-label="질문 확대: ${escapeHtml(q.text)}"><div class="note-copy">${escapeHtml(q.text)}</div></div>`).join(''):`<div class="empty-notes">질문이 놓일 자리</div>`;const count=$(`[data-count="${c.key}"]`);if(count)count.textContent=items.length});document.querySelectorAll('.note').forEach(el=>{fitCardText(el);el.addEventListener('pointerdown',onPointerDown);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openQuestion(el.dataset.id)}})}) ;let el=$('#sortStat');if(el)el.textContent=`전체 질문 ${state.cards.length}개 · 이동 ${changedCount()}개 · 추가 ${state.cards.filter(x=>x.added).length}개`}

function bindSort(){renderCards();$('#addQuestion').onclick=addQuestionModal;$('#submitBtn').onclick=()=>{showModal(`<h2>질문 분류를 제출할까요?</h2><p>질문카드를 확인하고 필요한 질문을 모두 추가했는지 살펴봐 주세요.</p><div class="warning">제출한 뒤에는 카드를 추가하거나 옮길 수 없어요.</div><div class="modal-actions"><button class="secondary" data-close>다시 살펴보기</button><button class="primary paper-cta" id="confirmSubmit">최종 제출하기</button></div>`,()=>{$('#confirmSubmit').onclick=async()=>{closeModal();busy('제출하고 있어요.');try{await flushSave();const r=await api('/api/student/submit',{});state=asState(r.student);unbusy();render()}catch(e){unbusy();alert(e.message);render()}}})}}

function closeModal(){if(modal){modal.remove();modal=null}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
function onPointerDown(e){if(e.button!==0||drag||modal)return;const src=e.currentTarget;let box=src.getBoundingClientRect();drag={id:src.dataset.id,src,x:e.clientX,y:e.clientY,offsetX:e.clientX-box.left,offsetY:e.clientY-box.top,width:box.width,height:box.height,isTouch:e.pointerType==='touch',active:false,timeout:null};src.setPointerCapture(e.pointerId);src.addEventListener('pointermove',onPointerMove);src.addEventListener('pointerup',onPointerUp);src.addEventListener('pointercancel',onPointerCancel);if(drag.isTouch)drag.timeout=setTimeout(()=>{if(drag){activateDrag();}},280)}
function activateDrag(){if(!drag||drag.active)return;drag.active=true;if(drag.timeout)clearTimeout(drag.timeout);drag.src.classList.add('drag-source');floating=drag.src.cloneNode(true);floating.classList.add('note-floating');floating.removeAttribute('id');floating.style.width=drag.width+'px';floating.style.height=drag.height+'px';document.body.appendChild(floating);positionFloat(drag.x,drag.y);if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}}
function positionFloat(x,y){if(!floating||!drag)return;floating.style.left=(x-drag.offsetX)+'px';floating.style.top=(y-drag.offsetY)+'px'}
function onPointerMove(e){if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.active&&!drag.isTouch&&Math.hypot(dx,dy)>7)activateDrag();if(!drag.active)return;positionFloat(e.clientX,e.clientY);document.querySelectorAll('.bucket').forEach(b=>b.classList.remove('drop-target'));let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.bucket');if(target)target.classList.add('drop-target');if(target){let sc=target.querySelector('.notes-scroller'),r=sc.getBoundingClientRect();if(e.clientY<r.top+27)sc.scrollTop-=12;if(e.clientY>r.bottom-27)sc.scrollTop+=12}}
function cleanupDrag(){if(!drag)return;let s=drag.src;clearTimeout(drag.timeout);s.classList.remove('drag-source');s.removeEventListener('pointermove',onPointerMove);s.removeEventListener('pointerup',onPointerUp);s.removeEventListener('pointercancel',onPointerCancel);floating?.remove();floating=null;document.querySelectorAll('.bucket').forEach(b=>b.classList.remove('drop-target'));drag=null}
function onPointerUp(e){if(!drag)return;const id=drag.id,wasDrag=drag.active;if(wasDrag){let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.bucket');if(target){let q=state.cards.find(x=>x.id===id);if(q&&q.category!==target.dataset.cat){q.category=target.dataset.cat;save();}}}cleanupDrag();if(wasDrag)renderCards();else openQuestion(id)}
function onPointerCancel(){cleanupDrag();renderCards()}
function completionStatus(){let count=state.cards.length, moved=changedCount(),added=state.cards.filter(x=>x.added).length;return `질문 ${count}개 · 분류 이동 ${moved}개 · 직접 추가 ${added}개`}
function reviewBoard(){return `<div class="board" aria-label="제출한 질문 분류 결과">${CATS.map(c=>{const qs=state.cards.filter(q=>q.category===c.key);return `<section class="bucket" data-cat="${c.key}"><div class="bucket-title"><b>${c.label}</b><span class="count">${qs.length}</span></div><div class="bucket-sub">질문카드를 누르면 크게 읽을 수 있어요</div><div class="notes-scroller"><div class="notes">${qs.length?qs.map((q,i)=>`<div class="note ${q.added?'added':''}" role="button" tabindex="0" data-review-id="${escapeHtml(q.id)}" style="--rotate:${(i%4-1.5)*.36}deg" aria-label="질문 크게 보기: ${escapeHtml(q.text)}"><div class="note-copy">${escapeHtml(q.text)}</div></div>`).join(''):'<div class="empty-notes">이 유형에 분류한 질문이 없어요</div>'}</div></div></section>`}).join('')}</div>`}
function reviewRecord(){return `<section class="panel complete-table-panel" aria-label="제출한 자세히 읽기 기록"><div class="panel-head"><strong>제출한 나의 기록</strong><div class="mini-info">✓ &nbsp; 읽기만 할 수 있어요</div></div><div class="table-viewport"><table class="record-table"><colgroup><col/><col/><col/></colgroup><thead><tr><th scope="col">글</th><th scope="col">1차 기록</th><th scope="col">2차 기록</th></tr></thead><tbody>${rows.map((t,i)=>`<tr><td class="passage"><span class="rowno">장면 ${String(i+1).padStart(2,'0')}</span>${markedPassage(t,i)}</td><td><div class="record-text ${state.first[i]?'':'empty'}">${escapeHtml(state.first[i]||'기록 없음')}</div></td><td><div class="record-text ${state.second[i]?'':'empty'}">${escapeHtml(state.second[i]||'기록 없음')}</div></td></tr>`).join('')}</tbody></table></div></section>`}
function completeView(){return `<div class="heading"><div class="title-cluster"><p class="eyebrow">FINISH · 제출 완료</p><h1>내가 정리한 질문들이에요!</h1><p class="desc">제출한 결과를 다시 살펴볼 수 있어요. 수정하거나 이동할 수는 없어요.</p></div></div><section class="complete-content" aria-label="제출 결과 보기"><div class="complete-head"><div class="complete-head-main"><span class="complete-check" aria-hidden="true">✓</span><div><h2>${student}번 학생, 제출 완료!</h2><p>잘 마쳤어요. 제출한 내용은 그대로 보관돼요.</p></div></div><span class="lock-pill" aria-label="제출 완료, 수정 불가">🔒 수정 잠금</span></div><div class="complete-controls"><div class="view-tabs" role="tablist" aria-label="결과 종류 선택"><button id="tabQuestions" role="tab" aria-selected="${completeTab==='questions'}" class="${completeTab==='questions'?'active':''}" type="button">질문 분류 결과</button><button id="tabRecords" role="tab" aria-selected="${completeTab==='records'}" class="${completeTab==='records'?'active':''}" type="button">자세히 읽기 기록</button></div><span class="result-stat">${completionStatus()}</span></div>${completeTab==='questions'?reviewBoard():reviewRecord()}<div class="complete-footer"><span class="helper">${completeTab==='questions'?'카드를 누르면 질문을 크게 볼 수 있어요. 제출 후에는 위치를 바꿀 수 없어요.':'1차·2차 기록을 읽을 수 있지만 변경할 수 없어요.'}</span></div></section>`}

function bindComplete(){
 $('#tabQuestions').onclick=()=>{completeTab='questions';render()};
 $('#tabRecords').onclick=()=>{completeTab='records';render()};
 if(completeTab==='questions')document.querySelectorAll('[data-review-id]').forEach(el=>{fitCardText(el);el.addEventListener('click',()=>openQuestion(el.dataset.reviewId));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openQuestion(el.dataset.reviewId)}})});
}
async function init(){try{config=await api('/api/config',undefined,'');numbers=config.numbers;rows=config.passages;if(token){try{await loadStudent();return}catch(e){token='';sessionStorage.removeItem('rf-student-token')}}renderLogin()}catch(e){app.innerHTML='<div class="login-wrap" style="margin:20vh auto"><h2>서버에 접속할 수 없어요.</h2><p>'+escapeHtml(e.message)+'</p><p>이 파일은 서버에서 실행해야 합니다. README 안내를 확인해 주세요.</p></div>'}}
init();window.addEventListener('resize',()=>{if(state&&(state.stage===2||state.stage===3))document.querySelectorAll('.note').forEach(fitCardText)});
})();
</script>
</body>
</html>
